[project]
name = "oura-stress"
version = "0.1.0"
description = "Notify when Oura daytime stress is building"
requires-python = ">=3.12"
dependencies = ["httpx", "typer", "keyring"]

[project.scripts]
oura-stress = "oura_stress.cli:app"

[dependency-groups]
dev = ["pytest", "respx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oura_stress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
